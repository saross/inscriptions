# cc-scratch-hygiene.conf — systemd-tmpfiles drop-in for the sapphire compute host.
#
# Purpose: age-evict REGENERABLE pytensor/numba compile caches and per-run
# pytensor scratch so they cannot grow without bound again. (On 2026-06-14 the
# numba kernel cache had reached 201 GB and per-run pytensor temp 13 GB / 2.97 M
# files — see PROVISIONING.md "Temp/scratch hygiene".)
#
# It reuses the always-active system systemd-tmpfiles-clean.timer (runs daily),
# so no new timer is needed. It deliberately targets ONLY regenerable compile
# caches — it does NOT touch model files, datasets, or other projects' data that
# live directly under ~/cc-scratch.
#
# Install (run on sapphire, as root):
#   sudo install -m 0644 scripts/sapphire-cc-scratch-hygiene.conf \
#       /etc/tmpfiles.d/cc-scratch-hygiene.conf
#   sudo systemd-tmpfiles --clean /etc/tmpfiles.d/cc-scratch-hygiene.conf   # apply now
#
# Field layout:  Type  Path  Mode  User  Group  Age
#   Type 'e' = if the directory exists, remove entries older than Age, keep the
#   directory itself. Globs are accepted in Path. Age cleanup spares anything
#   touched within the window (active runs keep recent atime/mtime), so it will
#   not evict a cache in use by a running fit.

e /home/shawn/cc-scratch/tmp             - - - 14d
e /home/shawn/cc-scratch/*/pytensor-tmp  - - - 14d
e /home/shawn/.pytensor/numba            - - - 14d
